name: Sinhala World News Video Bot

on:
  schedule:
    # Every 1 hour
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # SYSTEM PACKAGES
      # =========================
      - name: Install FFmpeg + Sinhala Fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core

          fc-cache -fv

      # =========================
      # CREATE ASSETS FOLDER
      # =========================
      - name: Create Folders
        run: |
          mkdir -p assets
          mkdir -p output

      # =========================
      # PYTHON DEPENDENCIES
      # =========================
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            feedparser \
            beautifulsoup4 \
            pillow \
            gTTS \
            deep-translator \
            moviepy \
            numpy \
            imageio \
            imageio-ffmpeg

      # =========================
      # CHECK FONTS
      # =========================
      - name: Check Sinhala Fonts
        run: |
          fc-list | grep Sinhala || true

      # =========================
      # RUN BOT
      # =========================
      - name: Run News Bot
        run: |
          python bot.py

      # =========================
      # UPLOAD VIDEO
      # =========================
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-video
          path: output/auto_video.mp4

      # =========================
      # SAVE USED.JSON
      # =========================
      - name: Commit used.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add used.json || true

          git diff --cached --quiet || git commit -m "Update used news list"

          git push || true
