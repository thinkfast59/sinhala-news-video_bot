name: Sinhala Telegram News Video Bot

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Sinhala Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core
          fc-cache -fv

      - name: Check Sinhala Fonts
        run: |
          fc-list | grep Sinhala || true

      - name: Create Folders
        run: |
          mkdir -p assets
          mkdir -p output

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sinhala News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-video
          path: output/auto_video.mp4

      - name: Commit Used News Memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add used.json || true
          git diff --cached --quiet || git commit -m "Update used news"
          git push || true
